[package]
name = "allocation-manager"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
vault-accounting = { path = "../vault-accounting" }
mint-redeem-controller = { path = "../mint-redeem-controller" }
fusd-token = { path = "../fusd-token" }
